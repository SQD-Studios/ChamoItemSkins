name: ChamoItemSkins
version: ${version}
description: "The skins plugin powering your servers"
website: "https://github.com/SQD-Studios/ChamoItemSkins"
authors: [ "SQD Studios" ]
contributors:
  - Chamogelastos

api-version: '1.21.11'

main: net.chamosmp.chamoitemskins.ChamoItemSkinsPlugin
loader: net.chamosmp.chamoitemskins.ChamoItemSkinsLoader

folia-supported: true

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
    HMCWarps:
      load: BEFORE
      required: false
    Nexo:
      load: BEFORE
      required: false

permissions:
  chamoitemskins.use:
    description: Allows using the /skins command
    default: true

  chamoitemskins.update:
    default: op

  chamoitemskins.admin:
    description: Allows using admin features
    default: op
    children:
      chamoitemskins.admin.editor: true
      chamoitemskins.admin.reload: true
      chamoitemskins.admin.give: true
      chamoitemskins.admin.access.revoke: true
      chamoitemskins.admin.access.give: true
      chamoitemskins.admin.migrate: true
      chamoitemskins.admin.help: true