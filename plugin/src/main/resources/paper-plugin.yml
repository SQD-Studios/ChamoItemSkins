name: ChamoItemSkins
version: ${version}
main: net.chamosmp.chamoitemskins.ChamoItemSkinsPlugin
api-version: '1.21.11'
loader: net.chamosmp.chamoitemskins.ChamoItemSkinsLoader
bootstrapper: net.chamosmp.chamoitemskins.ChamoItemSkinsBootstrap

folia-supported: true

authors: ["SQD Studios", Chamogelastos]

softdepend: [PlaceholderAPI, HMCWraps, Nexo]

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    HMCWarps:
      load: BEFORE
      required: false
      join-classpath: true
    Nexo:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  chamoitemskins.use:
    description: Allows using the /skins command
    default: true
  chamoitemskins.use.others:
    description: Allows using the /skins command on other people
    default: op
  chamoitemskins.admin:
    description: Allows using admin features
    default: op
  chamoitemskins.admin.editor:
    description: Allows opening the admin editor
    default: op
  chamoitemskins.admin.reload:
    description: Allows using /reload
    default: op
  chamoitemskins.admin.give:
    description: Allows using /give
    default: op
  chamoitemskins.admin.access.revoke:
    description: Allows using /access revoke
    default: op
  chamoitemskins.admin.access.give:
    description: Allows using /access give
    default: op
  chamoitemskins.admin.migrate:
    description: Allows using /migrate (plugin)
    default: op
  chamoitemskins.admin.help:
    description: Allows using /skinsadmin help
    default: op
  chamoitemskins.update:
    description: Get the plugin update notification
    default: op

libraries:
  - "com.zaxxer:HikariCP:7.1.0"
