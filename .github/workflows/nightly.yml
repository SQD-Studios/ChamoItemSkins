name: Nightly Build

on:
  schedule:
    # Runs every day at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write


    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew shadowJar

      - name: Upload to GitHub Release (Nightly)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Nightly Build"
          body: "This is an automated nightly pre-release built from the latest commit on the default branch."
          prerelease: true
          make_latest: false
          files: |
            ./build/libs/ChamoItemSkins-*-all.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}